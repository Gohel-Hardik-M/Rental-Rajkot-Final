<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register as an Owner — Rental Rajkot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">


<link rel="icon" href="/static/images/favi.jpeg" type="image/x-icon">


<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="rr-auth-wrap">
  <div class="rr-auth-card" style="max-width: 480px;">
    <div class="text-center mb-4">
      <span class="keypin-mark" style="width:54px;height:54px;">
        <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 4C8.5 4 4 8.5 4 14C4 19 7.4 23.2 12 24.4V33L14 36L16 33L18 36L20 33V24.4C24.6 23.2 28 19 28 14C28 8.5 23.5 4 18 4H14Z" fill="#E8A33D"/>
          <circle cx="16" cy="13" r="4" fill="#F5F6FA"/>
        </svg>
      </span>
      <h1 class="rr-display fs-3 mt-3 mb-1">Register as an Owner</h1>
      <p class="rr-text-muted small">List your hostel or room and start receiving inquiries.</p>
    </div>

    <form action="/owner/register_action" method="POST">
      <div class="mb-3">
        <label for="ownerName" class="form-label">Full Name</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-person rr-text-muted"></i></span>
          <input type="text" class="form-control border-start-0" id="ownerName" name="full_name" placeholder="e.g. Rajesh Prajapati" >
        </div>
      </div>
      <div class="mb-3">
        <label for="ownerEmail" class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope rr-text-muted"></i></span>
          <input type="email" class="form-control border-start-0" id="ownerEmail" name="email" placeholder="e.g. rajesh@example.com" >
        </div>
      </div>
      <div class="mb-3">
        <label for="ownerRegPhone" class="form-label">Phone Number</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-phone rr-text-muted"></i></span>
          <input type="tel" class="form-control border-start-0" id="ownerRegPhone" name="phone" placeholder="e.g. 98765 12340" >
        </div>
      </div>
     
      <div class="mb-3">
        <label for="ownerPassword2" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock rr-text-muted"></i></span>
          <input type="password" class="form-control border-start-0" id="ownerPassword2" name="password" placeholder="Create a password" >
        </div>
      </div>
      <div class="mb-4">
        <label for="ownerConfirmPassword" class="form-label">Confirm Password</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock-fill rr-text-muted"></i></span>
          <input type="password" class="form-control border-start-0" id="ownerConfirmPassword" name="confirm_password" placeholder="Re-enter your password" >
        </div>
      </div>
{% if message %}
<div class="alert alert-danger mb-3" role="alert">
    {{ message }}
</div>
{% endif %}
      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="ownerTerms" >
        <label class="form-check-label small rr-text-muted" for="ownerTerms">I agree to the Terms of Service and Owner Verification Policy</label>
      </div>

      <button type="submit" class="btn btn-rr-accent btn-rr-lg w-100 mb-3">
        <i class="bi bi-house-add"></i> Register
      </button>
     
      <p class="text-center small rr-text-muted mb-0">
        Already registered? <a href="/owner/login">Log in</a> &nbsp;·&nbsp; <a href="/"><i class="bi bi-arrow-left"></i> Back to browsing</a>
      </p>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
