<body>

<div class="admin-shell">

  <!-- SIDEBAR -->
  <aside class="admin-sidebar" id="ownerSidebar">

    <div class="brand-lockup">

      <span class="keypin-mark">
        <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 4C8.5 4 4 8.5 4 14C4 19 7.4 23.2 12 24.4V33L14 36L16 33L18 36L20 33V24.4C24.6 23.2 28 19 28 14C28 8.5 23.5 4 18 4H14Z"

        </svg>
      </span>

      Rental<span class="brand-accent">Rajkot</span>

    </div>

    <nav class="nav flex-column">

      <a class="nav-link" href="/add-job">
        <i class="bi bi-grid-1x2-fill"></i>
        Dashboard
      </a>

      <a class="nav-link" href="/add-job">
        <i class="bi bi-briefcase"></i>
        Add Job Vacancy
      </a>

      <a class="nav-link active" href="/add-category">
        <i class="bi bi-briefcase"></i>

        <i class="bi bi-box-arrow-right"></i>

      </a>

    </nav>

  <!-- MAIN -->
  <div class="admin-main">

    <!-- TOPBAR -->
    <div class="admin-topbar">

      <div class="d-flex align-items-center gap-3">

        <button
          class="btn btn-light d-lg-none"

      <div class="d-flex align-items-center gap-3">

          src="https://placehold.co/40x40/E8A33D/1F2430?text=HARDIK GOHEL"

    </div>


    <!-- CONTENT -->
    <div class="admin-content">

      <form action="/owner/add-category" method="POST">

        <div class="row g-4">

          <!-- LEFT SIDE -->
          <div class="col-lg-8">


            <!-- JOB BASIC DETAILS -->
            <div class="rr-form-card mb-4">

              <h2 class="fs-5 fw-bold mb-3">

                Category Details

              </h2>


              <div class="row g-3">




                <!-- COMPANY NAME -->
                <div class="col-md-6">

                  <label for="companyName" class="form-label">
                    Category Name
                  </label>

                  <input
                    type="text"
                    class="form-control"
                    id="companyName"
                    name="category_name"
                    placeholder="e.g. Sales & Marketing"
                >

                </div>



                   <button
                type="submit"
                class="btn btn-rr-primary btn-rr-lg w-100 mb-2">

                <i class="bi bi-check2-circle"></i>

                Add Category
