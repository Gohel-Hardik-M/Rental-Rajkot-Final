<!DOCTYPE html>
<html lang="en">
<head>

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7664870121499576"
     crossorigin="anonymous"></script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WE8TT04EP2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-WE8TT04EP2');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Add Job Vacancy — Rental Rajkot</title>

  <link rel="icon" href="/static/images/favi.jpeg" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <link rel="stylesheet" href="/static/css/style.css">

</head>

<body>

<div class="admin-shell">

  <!-- SIDEBAR -->
  <aside class="admin-sidebar" id="ownerSidebar">

    <div class="brand-lockup">

      <span class="keypin-mark">
        <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 4C8.5 4 4 8.5 4 14C4 19 7.4 23.2 12 24.4V33L14 36L16 33L18 36L20 33V24.4C24.6 23.2 28 19 28 14C28 8.5 23.5 4 18 4H14Z"
                fill="#E8A33D"/>
          <circle cx="16" cy="13" r="4" fill="#171B2E"/>
        </svg>
      </span>

      Rental<span class="brand-accent">Rajkot</span>

    </div>

    <nav class="nav flex-column">

      <a class="nav-link" href="/owner/dashboard">
        <i class="bi bi-grid-1x2-fill"></i>
        Dashboard
      </a>

      <a class="nav-link active" href="/owner/add-job">
        <i class="bi bi-briefcase"></i>
        Add Job Vacancy
      </a>

      <a class="nav-link" href="/owner/my-jobs">
        <i class="bi bi-list-ul"></i>
        My Job Vacancies
      </a>

      <hr class="border-secondary my-3">

      <a class="nav-link" href="/logout">
        <i class="bi bi-box-arrow-right"></i>
        Logout
      </a>

    </nav>

  </aside>


  <!-- MAIN -->
  <div class="admin-main">

    <!-- TOPBAR -->
    <div class="admin-topbar">

      <div class="d-flex align-items-center gap-3">

        <button
          class="btn btn-light d-lg-none"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#ownerSidebar">

          <i class="bi bi-list fs-4"></i>

        </button>

        <h1 class="fs-4 fw-bold mb-0">
          Add New Job Vacancy
        </h1>

      </div>

      <div class="d-flex align-items-center gap-3">

        <img
          src="https://placehold.co/40x40/E8A33D/1F2430?text=HARDIK GOHEL"
          class="rounded-circle"
          alt="Admin avatar">

      </div>

    </div>


    <!-- CONTENT -->
    <div class="admin-content">

      <form action="/owner/add-job" method="POST">

        <div class="row g-4">

          <!-- LEFT SIDE -->
          <div class="col-lg-8">


            <!-- JOB BASIC DETAILS -->
            <div class="rr-form-card mb-4">

              <h2 class="fs-5 fw-bold mb-3">

                <i class="bi bi-briefcase text-primary me-1"></i>

                Job Details

              </h2>


              <div class="row g-3">


                <!-- JOB TITLE -->
                <div class="col-12">

                  <label for="jobTitle" class="form-label">
                    Job Title
                  </label>

                  <input
                    type="text"
                    class="form-control"
                    id="jobTitle"
                    name="title"
                    placeholder="e.g. Technical Executive"
                 >

                </div>


                <!-- COMPANY NAME -->
                <div class="col-md-6">

                  <label for="companyName" class="form-label">
                    Company Name
                  </label>

                  <input
                    type="text"
                    class="form-control"
                    id="companyName"
                    name="company_name"
                    placeholder="e.g. UltraTech Cement"
                >

                </div>


                <!-- CATEGORY -->
                <div class="col-md-6">

                  <label for="categorySelect" class="form-label">
                    Job Category
                  </label>

                  <select
                    class="form-select"
                    id="categorySelect"
                    name="category_id"
                   >

          



                  <option selected disabled value="">
                    Select a category...
                  </option>

                            {% for category in categories %}
                            <option value="{{ category[0] }}">
                            {{ category[1] }}
                            </option>
                             {% endfor %}

                  </select>

                </div>


                <!-- AREA -->
                <div class="col-md-6">

                  <label for="areaSelect" class="form-label">
                    Area / Location
                  </label>

                  <select
                    class="form-select"
                    id="areaSelect"
                    name="area"
                >

                    <option selected disabled value="">
                      Select an area...
                    </option>

                    <option value="aaji-dam">Aaji Dam</option>
                    <option value="amin-marg">Amin Marg</option>
                    <option value="astron-chowk">Astron Chowk</option>
                    <option value="bedi">Bedi</option>
                    <option value="bedi-para">Bedi Para</option>
                    <option value="bhakti-nagar">Bhakti Nagar</option>
                    <option value="bus-stand">Bus Stand</option>
                    <option value="civil-hospital-road">Civil Hospital Road</option>
                    <option value="dhebar-road">Dhebar Road</option>
                    <option value="gondal-road">Gondal Road</option>
                    <option value="greenland-chowk">Greenland Chowk</option>
                    <option value="gandhigram">Gandhigram</option>
                    <option value="hanuman-madhi">Hanuman Madhi</option>
                    <option value="jamnagar-road">Jamnagar Road</option>
                    <option value="jangleshwar">Jangleshwar</option>
                    <option value="kalavad-road">Kalavad Road</option>
                    <option value="kisanpara">Kisanpara</option>
                    <option value="kotecha-chowk">Kotecha Chowk</option>
                    <option value="kuvadva-road">Kuvadva Road</option>
                    <option value="limda-chowk">Limda Chowk</option>
                    <option value="madhapar">Madhapar</option>
                    <option value="mavdi">Mavdi</option>
                    <option value="mavdi-main-road">Mavdi Main Road</option>
                    <option value="morbi-road">Morbi Road</option>
                    <option value="mota-mava">Mota Mava</option>
                    <option value="nanamava-main-road">Nana Mava Main Road</option>
                    <option value="nanamava-circle">Nana Mava Circle</option>
                    <option value="new-jagnath">New Jagnath</option>
                    <option value="nyari-dam-road">Nyari Dam Road</option>
                    <option value="panchayat-nagar">Panchayat Nagar</option>
                    <option value="pedak-road">Pedak Road</option>
                    <option value="popatpara">Popatpara</option>
                    <option value="prahlad-plot">Prahlad Plot</option>
                    <option value="race-course">Race Course</option>
                    <option value="race-course-ring-road">Race Course Ring Road</option>
                    <option value="raiya-road">Raiya Road</option>
                    <option value="rajputpara">Rajputpara</option>
                    <option value="ramkrishna-nagar">Ramkrishna Nagar</option>
                    <option value="ranchhod-nagar">Ranchhod Nagar</option>
                    <option value="ring-road">Ring Road</option>
                    <option value="sadhu-vasvani-road">Sadhu Vasvani Road</option>
                    <option value="samrat-industrial-area">Samrat Industrial Area</option>
                    <option value="shapar-veraval">Shapar Veraval</option>
                    <option value="subhash-road">Subhash Road</option>
                    <option value="tagore-road">Tagore Road</option>
                    <option value="trikon-baug">Trikon Baug</option>
                    <option value="tramba">Tramba</option>
                    <option value="university-road">University Road</option>
                    <option value="vavdi">Vavdi</option>
                    <option value="vidya-nagar">Vidya Nagar</option>
                    <option value="virani-chowk">Virani Chowk</option>
                    <option value="150-feet-ring-road">150 Feet Ring Road</option>
                    <option value="80-feet-road">80 Feet Road</option>
                    <option value="yagnik-road">Yagnik Road</option>

                  </select>

                </div>


              </div>

            </div>


            <!-- EXPERIENCE & SALARY -->
            <div class="rr-form-card mb-4">

              <h2 class="fs-5 fw-bold mb-3">

                <i class="bi bi-person-workspace text-primary me-1"></i>

                Experience & Salary

              </h2>


              <div class="row g-3">


                <!-- MIN EXPERIENCE -->
                <div class="col-md-6">

                  <label for="experienceMin" class="form-label">
                    Minimum Experience (Years)
                  </label>

                  <input
                    type="number"
                    step="0.5"
                    min="0"
                    class="form-control"
                    id="experienceMin"
                    name="experience_min"
                    placeholder="e.g. 1"
                   >

                </div>


                <!-- MAX EXPERIENCE -->
                <div class="col-md-6">

                  <label for="experienceMax" class="form-label">
                    Maximum Experience (Years)
                  </label>

                  <input
                    type="number"
                    step="0.5"
                    min="0"
                    class="form-control"
                    id="experienceMax"
                    name="experience_max"
                    placeholder="e.g. 5">

                </div>


                <!-- SALARY -->
                <div class="col-md-6">

                  <label for="salaryMin" class="form-label">
                    Minimum Salary (₹ / Year)
                  </label>

                  <input
                    type="number"
                    min="0"
                    class="form-control"
                    id="salaryMin"
                    name="salary_min"
                    placeholder="e.g. 275000">

                </div>


              </div>

            </div>


            <!-- JOB DESCRIPTION -->
            <div class="rr-form-card mb-4">

              <h2 class="fs-5 fw-bold mb-3">

                <i class="bi bi-card-text text-primary me-1"></i>

                Job Description

              </h2>


              <div class="mb-3">

                <label for="jobDescription" class="form-label">
                  Description
                </label>

                <textarea
                  class="form-control"
                  id="jobDescription"
                  name="description"
                  rows="8"
                  placeholder="Describe the role, responsibilities, preferred candidate profile, education requirements, employment details, etc."
                  ></textarea>

              </div>


              <div>

                <label for="jobSkills" class="form-label">
                  Skills
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="jobSkills"
                  name="skills"
                  placeholder="e.g. Technical Marketing, Communication, Data Management">

                <div class="form-text">
                  Separate multiple skills using commas.
                </div>

              </div>

            </div>


            <!-- APPLICATION -->
            <div class="rr-form-card mb-4">

              <h2 class="fs-5 fw-bold mb-3">

                <i class="bi bi-box-arrow-up-right text-primary me-1"></i>

                Application

              </h2>


              <div>

                <label for="applyLink" class="form-label">
                  Apply Link
                </label>

                <input
                  type="url"
                  class="form-control"
                  id="applyLink"
                  name="apply_link"
                  placeholder="https://company.com/careers/job..."
               >

                <div class="form-text">
                  Users will be redirected to this link when they click Apply Now.
                </div>

              </div>

            </div>


          </div>


          <!-- RIGHT SIDE -->
          <div class="col-lg-4">


            <!-- PUBLISHING -->
            <div class="rr-form-card sticky-summary">

              <h2 class="fs-5 fw-bold mb-3">

                <i class="bi bi-send text-primary me-1"></i>

                Publishing

              </h2>


  
              <!-- FEATURED -->
              <div class="facility-check-card mb-4">

                <input
                  class="form-check-input flex-shrink-0"
                  type="checkbox"
                  id="isFeatured"
                  name="is_featured"
                  value="true">

                <label
                  class="form-check-label flex-grow-1"
                  for="isFeatured">

                  <span class="fw-semibold d-block">
                    Featured Job
                  </span>

                  <span class="rr-text-muted small">
                    Highlight this vacancy on the jobs page.
                  </span>

                </label>

              </div>


              <hr>


              <!-- SUBMIT -->
              <button
                type="submit"
                class="btn btn-rr-primary btn-rr-lg w-100 mb-2">

                <i class="bi bi-check2-circle"></i>

                Publish Job Vacancy

              </button>


              <a
                href="/owner/dashboard"
                class="btn btn-outline-secondary w-100">

                Cancel

              </a>

            </div>


          </div>

        </div>

      </form>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
