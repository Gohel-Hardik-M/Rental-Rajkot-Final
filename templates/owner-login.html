<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Login — Rental Rajkot</title>

<link rel="icon" href="/static/images/favi.jpeg" type="image/x-icon">


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="rr-auth-wrap">
  <div class="rr-auth-card">
    <div class="text-center mb-4">
      <span class="keypin-mark" style="width:54px;height:54px;">
        <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 4C8.5 4 4 8.5 4 14C4 19 7.4 23.2 12 24.4V33L14 36L16 33L18 36L20 33V24.4C24.6 23.2 28 19 28 14C28 8.5 23.5 4 18 4H14Z" fill="#E8A33D"/>
          <circle cx="16" cy="13" r="4" fill="#F5F6FA"/>
        </svg>
      </span>
      <h1 class="rr-display fs-3 mt-3 mb-1">Owner Login</h1>
      <p class="rr-text-muted small">Manage your listings and tenant inquiries.</p>
    </div>

    <form action="/owner/login_action" method="POST">
      <div class="mb-3">
        <label for="ownerPhone" class="form-label">Email</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-phone rr-text-muted"></i></span>
          <input type="email" class="form-control border-start-0" id="ownerPhone" name="email" placeholder="e.g. abcd@gmail.com" >
        </div>
      </div>
      <div class="mb-4">
        <label for="ownerPassword" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock rr-text-muted"></i></span>
          <input type="password" class="form-control border-start-0" id="ownerPassword" name="password" placeholder="Enter your password">
        </div>
      </div>
      <button type="submit" class="btn btn-rr-accent btn-rr-lg w-100 mb-3">
        <i class="bi bi-box-arrow-in-right"></i> Login
      </button>
      {% if message %}
<div class="alert alert-danger mb-3" role="alert">
    {{ message }}
</div>
{% endif %}
      <p class="text-center small rr-text-muted mb-0">
        New owner? <a href="#">Register your property</a> &nbsp;·&nbsp; <a href="#"><i class="bi bi-arrow-left"></i> Back to browsing</a>
      </p>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
