<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Rental Rajkot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">


<link rel="icon" href="/static/images/favi.jpeg" type="image/x-icon">


<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="rr-auth-wrap">
  <div class="rr-auth-card" style="max-width: 480px;">
    <div class="text-center mb-4">
      <span class="keypin-mark" style="width:54px;height:54px;">
        <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 4C8.5 4 4 8.5 4 14C4 19 7.4 23.2 12 24.4V33L14 36L16 33L18 36L20 33V24.4C24.6 23.2 28 19 28 14C28 8.5 23.5 4 18 4H14Z" fill="#24305E"/>
          <circle cx="16" cy="13" r="4" fill="#F5F6FA"/>
        </svg>
      </span>
      <h1 class="rr-display fs-3 mt-3 mb-1">Create Your Account</h1>
      <p class="rr-text-muted small">Save listings, message owners and track your inquiries.</p>
    </div>

    <form action="#" method="POST">
      <div class="mb-3">
        <label for="tenantName" class="form-label">Full Name</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-person rr-text-muted"></i></span>
          <input type="text" class="form-control border-start-0" id="tenantName" name="full_name" placeholder="e.g. Aarav Mehta" required>
        </div>
      </div>
      <div class="mb-3">
        <label for="tenantEmail" class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope rr-text-muted"></i></span>
          <input type="email" class="form-control border-start-0" id="tenantEmail" name="email" placeholder="e.g. aarav@example.com" required>
        </div>
      </div>
      <div class="mb-3">
        <label for="tenantRegPhone" class="form-label">Phone Number</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-phone rr-text-muted"></i></span>
          <input type="tel" class="form-control border-start-0" id="tenantRegPhone" name="phone" placeholder="e.g. 98765 43210" required>
        </div>
      </div>
      <div class="mb-3">
        <label for="tenantCollege" class="form-label">College / University <span class="rr-text-muted fw-normal">(optional)</span></label>
        <select class="form-select" id="tenantCollege" name="college">
          <option selected value="">Select your college...</option>
          <option>Saurashtra University</option>
          <option>RK University</option>
          <option>Marwadi University</option>
          <option>Atmiya University</option>
          <option>Government Engineering College</option>
          <option>Other / Not a student</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="tenantPassword2" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock rr-text-muted"></i></span>
          <input type="password" class="form-control border-start-0" id="tenantPassword2" name="password" placeholder="Create a password" required>
        </div>
      </div>
      <div class="mb-4">
        <label for="tenantConfirmPassword" class="form-label">Confirm Password</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock-fill rr-text-muted"></i></span>
          <input type="password" class="form-control border-start-0" id="tenantConfirmPassword" name="confirm_password" placeholder="Re-enter your password" required>
        </div>
      </div>

      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="tenantTerms" required>
        <label class="form-check-label small rr-text-muted" for="tenantTerms">I agree to the Terms of Service and Privacy Policy</label>
      </div>

      <button type="submit" class="btn btn-rr-primary btn-rr-lg w-100 mb-3">
        <i class="bi bi-person-plus"></i> Create Account
      </button>
      <p class="text-center small rr-text-muted mb-0">
        Already have an account? <a href="tenant-login.html">Log in</a> &nbsp;·&nbsp; <a href="index.html"><i class="bi bi-arrow-left"></i> Back to browsing</a>
      </p>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
